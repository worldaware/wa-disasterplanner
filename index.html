// ── Master document builder ───────────────────────────────────────────────────
async function generateDocument(state) {
  const { Document, Packer, Paragraph, TextRun, TabStopType, AlignmentType } = DX();
  IFTHEN_SEQ = 0;
  const { profile: p, functions: fns, preparedness: pr, risks, config: c } = state;
  const co   = p.companyName     || '[COMPANY NAME]';
  const city = p.address         || '[ADDRESS]';
  const ind  = p.industry        || '[INDUSTRY]';
  const emp  = p.employees       || '[EMPLOYEE COUNT]';
  const locs = p.locations       || '[LOCATIONS]';
  const cons = c.consultantName  || '[CONSULTANT NAME]';
  const comp = c.consultantCompany || 'World Aware';
  const ver  = c.planVersion     || '1.0';
  const dt   = c.planDate        || new Date().toISOString().slice(0, 10);
  const dtText = fmtDate(dt);

  const sortedRisks = [...risks].sort((a, b) => (b.likelihood * b.impact) - (a.likelihood * a.impact));
  const critN  = sortedRisks.filter(r => r.likelihood * r.impact >= 15).length;
  const highN  = sortedRisks.filter(r => { const s = r.likelihood * r.impact; return s >= 10 && s < 15; }).length;
  const medN   = sortedRisks.filter(r => { const s = r.likelihood * r.impact; return s >= 5 && s < 10; }).length;
  const lowN   = sortedRisks.filter(r => r.likelihood * r.impact < 5).length;
  const gaps   = [pr.hasExistingPlan === 'no', pr.hasBackupPower === 'no', pr.remoteWork === 'no', pr.hasOffsiteBackup === 'no'].filter(Boolean).length;
  const plural = (n, w) => `${n} ${w}${n !== 1 ? 's' : ''}`;

  const selectedAnnexes = ANNEXES.filter(a => c.selectedAnnexes.includes(a.id));
  const tocLines = REQUIRED_SECTIONS.map((s, i) => [i + 1, s.label]);
  const annexLetters = selectedAnnexes.map((a, i) => [String.fromCharCode(65 + i), a.title]);
  const logo = await loadLogo();
  const tocLine = (k, label) => new Paragraph({ spacing:{ before:80, after:80 }, tabStops:[{ type:TabStopType.LEFT, position:900 }], children:[
    new TextRun({ text:k, bold:true, color:WA.amber6 }), new TextRun({ text:'\t' + sentence(label) }) ] });
  // Page breaks only before the executive summary and each annex; other sections flow on
  // so short section endings do not leave near-empty pages.
  const sec = (n, title) => dh1(title, { eyebrow:`Section ${n}`, pageBreak: n === 1 });

  const body = [
    // ── CONTENTS ──
    ...dh1('Contents'),
    ...tocLines.map(([n, label]) => tocLine(String(n), label)),
    ...(annexLetters.length > 0 ? [
      new Paragraph({ spacing:{ before:240, after:60 }, children:[new TextRun({ text:'Annexes', bold:true, color:WA.muted })] }),
      ...annexLetters.map(([letter, title]) => tocLine(letter, title)),
    ] : []),
    dspacer(160, 0),
    dnote('Each section and annex is a Word heading. Open View > Navigation Pane in Word to jump between them.'),

    // ── SECTION 1: EXECUTIVE SUMMARY ──
    ...sec(1, 'Executive Summary'),
    new Paragraph({ style:'WALead', children: runs(`${co} has developed this Disaster and Business Continuity Plan (BCP) to ensure the organization can prepare for, respond to, and recover from events that disrupt normal operations. This plan establishes clear procedures, defined responsibilities, and recovery priorities to minimize the impact of disruptions on employees, customers, and business operations.`) }),
    dh2('Key Findings'),
    twoColTable([
      ['Critical functions identified',  `${plural(fns.length, 'function')} documented`],
      ['Total hazards assessed',         plural(risks.length, 'hazard')],
      ['Critical risks (score 15–25)',   `${critN}. Require immediate action`],
      ['High risks (score 10–14)',       `${highN}. Require priority treatment`],
      ['Preparedness gaps identified',   `${plural(gaps, 'gap')}. See Section 3`],
      ['Plan version',                   `${ver}, dated ${dtText}`],
    ]),
    dh2('Activation Authority'),
    dp(`This plan may be activated by any member of the Crisis Management Team when an event threatens or disrupts normal ${co} operations. Activation does not require all conditions to be met — use judgment based on the nature and scope of the event.`),
    dh2('Top Priority Risks'),
    ...(sortedRisks.length ? [waTable(
      [ {title:'Hazard',width:5000,bold:true}, {title:'Score',width:1600,bold:true}, {title:'Risk band',width:2760} ],
      sortedRisks.slice(0, 5).map(r => { const s = r.likelihood * r.impact; return [ r.name, `${s}`, { __cell: riskCell(bandOf(s), 2760), __band: bandOf(s), __w: 2760 } ]; })
    )] : [dp('[No risks rated yet]')]),

    // ── SECTION 2: INTRODUCTION & PURPOSE ──
    ...sec(2, 'Introduction & Purpose'),
    dh2('Plan Purpose'),
    dp(`This Business Continuity Plan (BCP) establishes the framework for ${co} to respond to and recover from disruptive events while maintaining critical business functions. It is designed as a working template.`),
    waNote('To complete.', 'Text shown like [THIS] is a field to complete. In Word, select it and type over it; the highlight goes away with the brackets.'),
    dh2('Scope'),
    dp(`This plan applies to all ${co} employees, contractors, and facilities. It covers ${fns.length} identified critical business function${fns.length !== 1 ? 's' : ''} across ${locs} location${locs !== '1' ? 's' : ''}.`),
    dh2('Objectives'),
    dbullet('Protect employee safety and wellbeing above all other priorities.'),
    dbullet('Maintain or rapidly restore critical business functions.'),
    dbullet('Minimize financial losses, reputational damage, and regulatory exposure.'),
    dbullet('Communicate effectively with employees, customers, and stakeholders.'),
    dbullet('Ensure a systematic and documented recovery process.'),
    dh2('Plan Assumptions'),
    dbullet('At least one member of the Crisis Management Team is reachable at all times.'),
    dbullet('Employees have been trained on their roles in this plan.'),
    dbullet('This plan is reviewed and updated at least annually.'),
    dbullet('Individual departments maintain department-level procedures aligned with this plan.'),
    dh2('Key Definitions'),
    dkv('Crisis Management Team (CMT)', 'The group of senior leaders responsible for activating and managing this plan.'),
    dkv('Recovery Time Objective (RTO)', 'The maximum time a critical function can be offline before unacceptable impact occurs.'),
    dkv('Recovery Point Objective (RPO)', 'The maximum age of data that must be recovered — defines backup frequency requirements.'),
    dkv('Maximum Tolerable Downtime (MTD)', 'The longest period the organization can function without a critical resource.'),
    dkv('Incident Commander', 'The designated leader responsible for overall coordination of the response.'),

    // ── SECTION 3: SITUATION OVERVIEW ──
    ...sec(3, 'Situation Overview'),
    dh2('Organization Profile'),
    twoColTable([
      ['Legal name',              co],
      ['Industry',                ind],
      ['Headquarters',            city],
      ['Number of employees',     emp],
      ['Number of locations',     locs],
      ['Primary contact',         ''],
      ['Title',                   ''],
      ['Emergency phone',         ''],
      ['Emergency email',         ''],
    ]),
    dh2('Critical Business Functions'),
    dp('The following functions have been identified as critical to operations. They represent the highest recovery priorities.'),
    fns.length > 0 ? functionsTable(fns) : dp('[No critical functions were entered. Please complete the intake form.]'),
    dh2('Preparedness Status'),
    twoColTable([
      ['Existing emergency plan',   pr.hasExistingPlan === 'yes' ? 'In place. Review for alignment with this BCP' : pr.hasExistingPlan === 'no' ? 'Not in place. High-priority gap' : '[Not specified]'],
      ['Backup power (generator)',  pr.hasBackupPower  === 'yes' ? 'In place. Document capacity and test schedule' : pr.hasBackupPower  === 'no' ? 'Not in place. Evaluate need' : '[Not specified]'],
      ['Remote work capability',    pr.remoteWork === 'yes-all' ? 'Yes, all employees capable' : pr.remoteWork === 'partial' ? 'Partially. Identify roles that cannot work remotely' : pr.remoteWork === 'no' ? 'No remote capability. Significant gap' : '[Not specified]'],
      ['Offsite data backup',       pr.hasOffsiteBackup === 'yes' ? 'In place. Verify frequency and restore testing' : pr.hasOffsiteBackup === 'no' ? 'Not in place. Critical gap for data recovery' : '[Not specified]'],
    ]),
    ...(gaps > 0 ? [
      dspacer(160, 80),
      waNote('Gap identified.', `${gaps} preparedness gap${gaps > 1 ? 's' : ''} identified. The items marked "Not in place" or "No" above represent significant gaps in organizational preparedness. Each gap should be assigned an owner and a target completion date immediately.`, 'gap'),
    ] : []),

    // ── SECTION 4: RISK ASSESSMENT ──
    ...sec(4, 'Risk Assessment'),
    dh2('Methodology'),
    dp('Risk scores are calculated using a 5×5 Likelihood × Impact matrix (ISO 31000). Each hazard is rated on two axes:'),
    dbullet('Likelihood: 1 (Rare) to 5 (Almost Certain)'),
    dbullet('Impact: 1 (Insignificant) to 5 (Catastrophic)'),
    dbullet('Risk Score = Likelihood × Impact (range: 1–25)'),
    dspacer(120, 60),
    bandKeyTable([
      ['1–4',   'Low',      'Monitor; maintain standard controls'],
      ['5–9',   'Medium',   'Implement additional controls; include in annual review'],
      ['10–14', 'High',     'Priority treatment; specific response plan required'],
      ['15–25', 'Critical', 'Immediate executive attention; dedicated annex required'],
    ]),
    dh2('Risk Register'),
    ...(risks.length > 0 ? [riskTable(risks)] : [dp('[No risks were entered during the risk assessment. Please complete Phase 2 of the intake process.]')]),
    dh2('Risk Summary'),
    twoColTable([
      ['Critical (15–25)', plural(critN, 'hazard')],
      ['High (10–14)',     plural(highN, 'hazard')],
      ['Medium (5–9)',     plural(medN, 'hazard')],
      ['Low (1–4)',        plural(lowN, 'hazard')],
      ['Total assessed',   plural(risks.length, 'hazard')],
    ]),

    // ── SECTION 5: COMMUNICATIONS ──
    ...sec(5, 'Communications'),
    dh2('Notification Cascade'),
    dp('When an incident is declared, notifications must be issued in the following sequence:'),
    ...difthen('an incident is declared', [
      'Incident Commander notifies all Crisis Management Team members within 1 hour.',
      'Department heads notify their direct reports within 2 hours.',
      'HR notifies all employees via [EMAIL / MASS NOTIFICATION SYSTEM] within 4 hours.',
      'External communications (customers, vendors, media) as directed by Incident Commander.',
    ]),
    dh2('Crisis Management Team Contacts'),
    twoColTable([
      ['Role',                    'Name  |  Phone  |  Email'],
      ['Incident Commander',      ''],
      ['Operations Lead',         ''],
      ['IT / Technology Lead',    ''],
      ['HR Lead',                 ''],
      ['Finance Lead',            ''],
      ['Communications / PR',     ''],
      ['Legal Counsel',           ''],
    ], { header:true }),
    dh2('Stakeholder Communication Matrix'),
    twoColTable([
      ['Audience',       'Timing'],
      ['Employees',      'Within 4 hours of activation'],
      ['Key Customers',  'Within 24 hours — prioritize largest accounts'],
      ['Key Vendors',    'Within 24 hours — prioritize single-source suppliers'],
      ['Board / Owners', 'Immediately upon activation'],
      ['Regulators',     'Per applicable regulatory requirements'],
      ['Media / Press',  'Only via designated spokesperson — no employee comments'],
      ['General Public', 'Via press release if broad public impact — legal review required'],
    ], { header:true }),
    dh2('Communication Templates'),
    dh3('Employee Notification — Initial Alert'),
    dp('[SUBJECT: {Company Name} — Emergency Notification]'),
    dp('[SALUTATION],'),
    dp(`[${co}] is responding to [DESCRIBE INCIDENT] that occurred on [DATE / TIME]. Your safety is our first priority.`),
    dp('[Describe immediate actions employees should take: e.g., work from home, report to alternate location, stand by for further instructions.]'),
    dp(`Updates will be provided every [X hours] via [CHANNEL]. For questions, contact [NAME] at [PHONE / EMAIL].`),
    dh3('Customer Notification — Service Impact'),
    dp('[SUBJECT: Important Update Regarding Your {Product / Service}]'),
    dp('Dear [CUSTOMER NAME],'),
    dp(`We are writing to inform you that [${co}] is currently experiencing [BRIEF DESCRIPTION OF ISSUE] which may affect [DESCRIBE IMPACT ON CUSTOMER]. We sincerely apologize for any inconvenience.`),
    dp('[Describe what you are doing to resolve the issue and the expected timeline.]'),
    dp(`If you have urgent needs, please contact [NAME] at [PHONE / EMAIL]. We appreciate your patience.`),

    // ── SECTION 6: TRAINING & MAINTENANCE ──
    ...sec(6, 'Training & Maintenance'),
    dh2('Training Requirements'),
    twoColTable([
      ['Audience',              'Training Content'],
      ['All employees',         'Emergency procedures, evacuation routes, reporting protocols — Annually'],
      ['Crisis Management Team','Full plan review and tabletop exercise — Annually'],
      ['Department managers',   'Department-level BCP procedures — Annually'],
      ['New hires',             'Basic emergency orientation — Within 30 days of hire'],
      ['IT staff',              'IT DR procedures and backup restore test — Annually'],
    ], { header:true }),
    dh2('Exercise Schedule'),
    twoColTable([
      ['Exercise Type',             'Frequency'],
      ['Fire / Evacuation Drill',   'Twice per year'],
      ['BCP Tabletop Exercise',     'Annually — CMT and key staff'],
      ['IT Disaster Recovery Test', 'Annually — restore from backup, document results'],
      ['Communication Tree Test',   'Annually — test all emergency contacts'],
      ['Full-Scale Exercise',       'Every 2–3 years — simulate major incident'],
    ], { header:true }),
    dh2('Plan Review & Update Schedule'),
    dbullet(`Annual Review: Every year on [TARGET MONTH], or more frequently if required.`),
    dbullet('Trigger Review: After any activation, significant organizational change, or near-miss event.'),
    dbullet('Owner: Incident Commander or designated BCP Coordinator.'),
    dbullet(`Next Scheduled Review: [DATE].`),
    dh2('Distribution List'),
    twoColTable([
      ['Recipient',              'Title'],
      ['[NAME]',                '[Incident Commander]'],
      ['[NAME]',                '[Operations Lead]'],
      ['[NAME]',                '[IT Lead]'],
      ['[NAME]',                '[HR Lead]'],
      ['[DEPARTMENT MANAGER]',  '[Department]'],
      ['External Location',     'Offsite copy — [LOCATION / CLOUD FOLDER]'],
    ], { header:true }),
    dnote(`Document prepared by ${cons}, ${comp}. Version ${ver}, ${dtText}.`),

    // ── ANNEXES ──
    ...selectedAnnexes.flatMap((a, i) => {
      const L = String.fromCharCode(65 + i);
      return [
        ...dh1(a.title, { eyebrow:`Annex ${L}`, pageBreak:true }),
        new Paragraph({ style:'WALead', children: runs(`This annex is part of the ${co} Business Continuity Plan (version ${ver}).`) }),
        ...annexPages(a.id, state),
        new Paragraph({ style:'WASmall', spacing:{ before:360 }, children:[new TextRun(`End of Annex ${L}`)] }),
      ];
    }),
  ];

  const doc = new Document({
    creator: comp,
    title:   `${co} Business Continuity Plan`,
    description: `Prepared by ${cons}, ${comp}. Version ${ver}`,
    styles: waStyles(),
    numbering: waNumbering(),
    sections: [
      { properties:{ page: WA_PAGE }, children: waCover({ logo, client:co, industry:[ind, p.employees && `${p.employees} employees`, p.locations && `${p.locations} location${p.locations !== '1' ? 's' : ''}`].filter(Boolean).join(', '), dateText:dtText, version:ver, preparedBy:`${comp} · ${cons}` }) },
      { properties:{ page: WA_PAGE }, headers:{ default: waHeader(logo, co) }, footers:{ default: waFooter(`Version ${ver}  |  ${dtText}`) }, children: body },
    ],
  });

  const blob = await Packer.toBlob(doc);
  saveAs(blob, `${safeFileName(co)}_BCP_v${ver}_${dt}.docx`);
}

// ── PHASE 3: PLAN CONFIG ─────────────────────────────────────────────────────
function StepConfig({ config, onChange, risks, errors }) {
  const f = k => v => onChange({...config, [k]: v});
  const recommended = computeRecommended(risks);
  const highCount   = risks.filter(r => score(r) >= 10).length;
  function toggleAnnex(id) {
    const next = config.selectedAnnexes.includes(id) ? config.selectedAnnexes.filter(x => x!==id) : [...config.selectedAnnexes, id];
    onChange({...config, selectedAnnexes: next});
  }
  const totalSections = REQUIRED_SECTIONS.length + config.selectedAnnexes.length;

  return (
    <div>
      <StepHead phase="Plan configuration" title="Sections and annexes">Choose the annexes to include and confirm who prepared the plan.</StepHead>
      <div className="stack-lg">
        {highCount > 0 && recommended.length > 0 && (
          <Alert tone="note" title="Recommended from the risk assessment">
            {highCount} hazard{highCount>1?'s':''} scored High or Critical. {recommended.length} annex{recommended.length>1?'es that address them are':' that addresses them is'} preselected and marked Recommended.
          </Alert>
        )}

        <section>
          <div className="flex items-center justify-between gap-3 mb-3"><h2 className="section-title" style={{margin:0}}>Required sections</h2><span className="tag plain">Always included</span></div>
          <ol className="sheet outlist" style={{padding:'4px 16px'}}>
            {REQUIRED_SECTIONS.map((s, i) => (
              <li key={s.id}><span className="k">{i+1}</span><span><b className="font-medium">{s.label}</b><span className="help" style={{display:'block'}}>{s.desc}</span></span><span/></li>
            ))}
          </ol>
        </section>

        <section>
          <div className="flex items-center justify-between gap-3 mb-3 flex-wrap"><h2 className="section-title" style={{margin:0}}>Optional annexes</h2><span className="help">{config.selectedAnnexes.length} of {ANNEXES.length} selected</span></div>
          <div className="grid gap-2">
            {ANNEXES.map(a => (
              <Checkbox key={a.id} checked={config.selectedAnnexes.includes(a.id)} onChange={() => toggleAnnex(a.id)}>
                <span style={{flex:1,minWidth:0}}>
                  <span className="ttl ttl-ic"><Icon name={a.icon} className="hz-ic"/><span className="tt">{a.title}{recommended.includes(a.id) && <span className="tag">Recommended</span>}</span></span>
                  <span className="d">{a.subtitle}</span>
                </span>
              </Checkbox>
            ))}
          </div>
          <div className="flex gap-4 mt-3 flex-wrap">
            <button type="button" onClick={() => onChange({...config, selectedAnnexes: ANNEXES.map(a=>a.id)})} className="linkbtn">Select all</button>
            <button type="button" onClick={() => onChange({...config, selectedAnnexes: recommended})} className="linkbtn">Recommended only</button>
            <button type="button" onClick={() => onChange({...config, selectedAnnexes: []})} className="linkbtn">Clear all</button>
          </div>
        </section>

        <section>
          <h2 className="section-title">Consultant information</h2>
          <div className="stack">
            <div className="fields-2">
              <Field label="Consultant name" error={errors.consultantName}><TInput value={config.consultantName} onChange={f('consultantName')} placeholder="Henry Mitchell" autoComplete="name"/></Field>
              <Field label="Consultant company"><TInput value={config.consultantCompany} onChange={f('consultantCompany')} placeholder="World Aware"/></Field>
            </div>
            <div className="fields-2">
              <Field label="Plan version" hint="Increase it each time the plan is revised."><TInput value={config.planVersion} onChange={f('planVersion')} placeholder="1.0"/></Field>
              <Field label="Plan date"><TInput type="date" value={config.planDate} onChange={f('planDate')}/></Field>
            </div>
          </div>
        </section>

        <section>
          <h2 className="section-title">Document outline</h2>
          <div className="sheet pad">
            <ol className="outlist">
              {REQUIRED_SECTIONS.map((s, i) => <li key={s.id}><span className="k">{i+1}</span><span className="nm">{s.label}</span><span/></li>)}
              {config.selectedAnnexes.map((id, i) => { const a = ANNEXES.find(x => x.id===id); if(!a) return null;
                return <li key={id}><span className="k">{String.fromCharCode(65+i)}</span><span className="nm"><Icon name={a.icon} size={16} className="hz-ic"/>{a.title}</span><span className="tag plain">Annex</span></li>; })}
            </ol>
            <p className="help mt-3 pt-3" style={{borderTop:'1px solid var(--color-border)'}}>{totalSections} section{totalSections!==1?'s':''}. Version {config.planVersion || '1.0'}, {fmtDate(config.planDate || TODAY)}</p>
          </div>
        </section>
      </div>
    </div>
  );
}

// ── GENERATE STEP ────────────────────────────────────────────────────────────
function ReadyScreen({ state, onBack, onDashboard }) {
  const { profile:p, risks, config:c } = state;
  const sorted   = [...risks].sort((a,b) => score(b)-score(a));
  const critN    = sorted.filter(r => score(r)>=15).length;
  const highN    = sorted.filter(r => { const s=score(r); return s>=10&&s<15; }).length;
  const totalSec = REQUIRED_SECTIONS.length + c.selectedAnnexes.length;
  const missingConsultant = !c.consultantName.trim();
  const [genStatus, setGenStatus] = useState('idle');
  const [genError,  setGenError]  = useState('');
  const fileName = `${safeFileName(p.companyName)}_BCP_v${c.planVersion||'1.0'}_${c.planDate||'today'}.docx`;

  async function handleGenerate() {
    setGenStatus('generating'); setGenError('');
    try { await generateDocument(state); setGenStatus('done'); }
    catch(e) { console.error(e); setGenError(e?.message || 'Unexpected error.'); setGenStatus('error'); }
  }
  const stats = [
    { label:'Critical risks', value:critN, sub:'act now', badge: critN>0 ? 15 : null },
    { label:'High risks',     value:highN, sub:'need a specific plan', badge: highN>0 ? 10 : null },
    { label:'Critical functions', value:state.functions.length, sub:'recovery priorities' },
    { label:'Plan sections',  value:totalSec, sub:'in the document' },
  ];

  return (
    <div>
      <StepHead phase="Plan configuration" title="Generate the plan">Everything for <b style={{color:'var(--color-text)'}}>{p.companyName}</b> is collected. Download the Word document, then complete the highlighted fields in Word.</StepHead>
      <div className="stack-lg">
        <div className="stats">
          {stats.map(s => (
            <div key={s.label} className="sheet stat">
              <span className="v">{s.value}</span>
              <span className="l">{s.label}</span>
              {s.badge ? <span><RiskBadge s={s.badge}/></span> : <span className="s">{s.sub}</span>}
            </div>
          ))}
        </div>

        <section>
          <h2 className="section-title">Document outline</h2>
          <div className="sheet pad">
            <ol className="outlist">
              {REQUIRED_SECTIONS.map((s, i) => <li key={s.id}><span className="k">{i+1}</span><span className="nm">{s.label}</span><span className="tag plain">Required</span></li>)}
              {c.selectedAnnexes.map((id, i) => { const a = ANNEXES.find(x => x.id===id); if(!a) return null;
                return <li key={id}><span className="k">{String.fromCharCode(65+i)}</span><span className="nm"><Icon name={a.icon} size={16} className="hz-ic"/>{a.title}</span><span className="tag">Annex</span></li>; })}
            </ol>
            <p className="help mt-3 pt-3" style={{borderTop:'1px solid var(--color-border)'}}>Prepared by {c.consultantName||'—'}, {c.consultantCompany||'World Aware'}. Version {c.planVersion||'1.0'}, {fmtDate(c.planDate||TODAY)}</p>
          </div>
        </section>

        {missingConsultant && (
          <Alert tone="warn" title="Consultant name is missing">Add it on the previous step before generating. <button type="button" onClick={onBack} className="linkbtn">Go back to add it</button></Alert>
        )}

        <section className="gen" aria-live="polite">
          {genStatus === 'idle' && <>
            <h2>Business Continuity Plan, Word document</h2>
            <p>A {totalSec}-section .docx with the World Aware cover, risk register, IF/THEN procedures and communication templates. Fields to complete are highlighted in amber.</p>
            <div><button type="button" disabled={missingConsultant} onClick={handleGenerate} className="btn btn-amber btn-lg"><Icon name="file-down"/>Download plan</button></div>
          </>}
          {genStatus === 'generating' && <>
            <div className="flex items-center gap-3"><span className="spinner" aria-hidden="true"/><h2>Building the document</h2></div>
            <p>Assembling {totalSec} sections and the risk data. This takes a few seconds.</p>
          </>}
          {genStatus === 'done' && <>
            <div className="flex items-center gap-3"><Icon name="circle-check" size={24}/><h2>Plan downloaded</h2></div>
            <p>Look in your downloads folder for <span className="file">{fileName}</span>. Open it in Word, then select each highlighted [FIELD] and type over it.</p>
            <div className="flex gap-3 flex-wrap"><button type="button" onClick={handleGenerate} className="btn btn-amber"><Icon name="download"/>Download again</button><button type="button" onClick={onDashboard} className="btn btn-secondary"><Icon name="arrow-left"/>All plans</button></div>
          </>}
          {genStatus === 'error' && <>
            <div className="flex items-center gap-3"><Icon name="circle-alert" size={24}/><h2>The document was not created</h2></div>
            {genError && <p className="err">{genError}</p>}
            <p>Check your connection and try again. Your answers are saved.</p>
            <div><button type="button" onClick={handleGenerate} className="btn btn-amber">Try again</button></div>
          </>}
        </section>

        <div className="step-nav">
          <button type="button" onClick={onBack} className="btn btn-ghost"><Icon name="arrow-left"/>Edit configuration</button>
          <button type="button" onClick={() => { const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}); saveAs(blob, `${safeFileName(state.profile.companyName||'Plan')}_plan.json`); }} className="btn btn-secondary"><Icon name="upload"/>Export plan data (JSON)</button>
        </div>
      </div>
    </div>
  );
}

// ── ABOUT ────────────────────────────────────────────────────────────────────
function AboutModal({ onClose }) {
  const ref = useRef(null);
  useEffect(() => { ref.current?.focus(); const k = e => e.key==='Escape' && onClose(); window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  return (
    <div className="scrim" onClick={onClose}>
      <div className="dialog" role="dialog" aria-modal="true" aria-labelledby="about-t" onClick={e => e.stopPropagation()}>
        <img src="assets/wa-lockup-full-color.png" alt="World Aware, Emergency Planning" style={{width:200,marginBottom:20}}/>
        <h2 id="about-t">Business Continuity Plan Builder</h2>
        <p className="muted mb-5">Builds a client-ready business continuity plan: company intake, a scored risk assessment, critical functions and a Word document with response procedures for each major hazard.</p>
        <dl className="dl mb-5">
          <div><dt>Company</dt><dd>World Aware</dd></div>
          <div><dt>Website</dt><dd><a href="https://beworldaware.com" target="_blank" rel="noopener noreferrer">beworldaware.com</a></dd></div>
          <div><dt>Version</dt><dd>2.0</dd></div>
        </dl>
        <button ref={ref} type="button" onClick={onClose} className="btn btn-primary w-full">Close</button>
      </div>
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function TopBar({ onShowAbout, current }) {
  return (
    <header className="topbar">
      <a href="./" aria-label="World Aware plan builder home"><img className="logo" src="assets/wa-lockup-full-color.png" alt="World Aware, Emergency Planning" width="130" height="30"/></a>
      <nav aria-label="Main">
        <a href="./" aria-current={current==='plans'?'page':undefined}>Plans</a>
        <a href="business-impact.html" aria-current={current==='bia'?'page':undefined}><span className="hidden sm:inline">Business impact</span><span className="sm:hidden">Impact</span></a>
        {onShowAbout && <button type="button" onClick={onShowAbout}>About</button>}
      </nav>
    </header>
  );
}
function planProgress(p) {
  const risks = p.risks || [];
  if(p.config?.consultantName && risks.length) return { step:8, label:'Ready to generate' };
  if(risks.length) return { step:6, label:'Risks rated' };
  if((p.selectedHazardIds||[]).length) return { step:5, label:'Hazards selected' };
  if(p.profile?.companyName) return { step:2, label:'Intake started' };
  return { step:1, label:'Not started' };
}
function Dashboard({ plans, onNew, onEdit, onDelete, onShowAbout, onImport }) {
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [importError,   setImportError]   = useState('');

  function handleImport(e) {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(!data.profile) throw new Error('Invalid plan file');
        const imported = { ...newPlan(), ...data, id: data.id || uid(), updatedAt: new Date().toISOString() };
        onImport(imported); setImportError('');
      } catch { setImportError('That file is not a World Aware plan. Choose a .json file exported from this tool.'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  }
  function exportAll() { const blob = new Blob([JSON.stringify(dbLoad(), null, 2)], {type:'application/json'}); saveAs(blob, `WorldAware_AllPlans_${TODAY}.json`); }
  function exportPlan(p) { const blob = new Blob([JSON.stringify(p, null, 2)], {type:'application/json'}); saveAs(blob, `${safeFileName(p.profile?.companyName||'Plan')}_plan.json`); }
  function clearAll() { if(!window.confirm('Delete ALL plans permanently? This cannot be undone.')) return; localStorage.removeItem(DB_KEY); window.location.reload(); }
  const sorted = [...plans].sort((a,b) => new Date(b.updatedAt||0) - new Date(a.updatedAt||0));

  return (
    <div className="app">
      <TopBar onShowAbout={onShowAbout} current="plans"/>
      <main className="content flex-1">
        <div className="wide">
          <div className="page-head">
            <div><h1>Client plans</h1><p>{plans.length} plan{plans.length!==1?'s':''} saved in this browser</p></div>
            <button type="button" onClick={onNew} className="btn btn-primary"><Icon name="plus"/>New plan</button>
          </div>

          {sorted.length === 0 ? (
            <div className="empty">
              <h2>No saved plans yet</h2>
              <p>Start with the company profile. It takes about ten minutes, and you can stop and come back.</p>
              <button type="button" onClick={onNew} className="btn btn-primary"><Icon name="plus"/>Start a plan</button>
            </div>
          ) : (
            <div className="plans">
              {sorted.map(p => {
                const rs = p.risks || [];
                const critN = rs.filter(r => r.likelihood*r.impact>=15).length;
                const highN = rs.filter(r => { const s=r.likelihood*r.impact; return s>=10&&s<15; }).length;
                const updated = p.updatedAt ? new Date(p.updatedAt).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '—';
                const prog = planProgress(p);
                const ann = (p.config?.selectedAnnexes||[]).length;
                return (
                  <article key={p.id} className="sheet pad plan-card">
                    <div className="top">
                      <div style={{minWidth:0}}>
                        <h3>{p.profile?.companyName || 'Unnamed plan'}</h3>
                        <p className="meta">{p.profile?.industry || 'Industry not set'}{p.profile?.employees ? `, ${p.profile.employees} employees` : ''}</p>
                      </div>
                      <span className="tag">{prog.label}</span>
                    </div>
                    <div className="prog" aria-hidden="true"><i style={{width:`${Math.round(prog.step/8*100)}%`}}/></div>
                    <div className="counts">
                      {critN > 0 && <span className="flex items-center gap-2"><span className="num">{critN}</span><RiskBadge s={15}/></span>}
                      {highN > 0 && <span className="flex items-center gap-2"><span className="num">{highN}</span><RiskBadge s={10}/></span>}
                      {!rs.length && <span className="badge b-none">No risks rated</span>}
                      {ann > 0 && <span className="tag plain">{ann} annex{ann!==1?'es':''}</span>}
                    </div>
                    <p className="meta">Edited {updated}</p>
                    <div className="acts">
                      <button type="button" onClick={() => onEdit(p)} className="btn btn-secondary btn-sm"><Icon name="pencil" size={16}/>Continue plan</button>
                      <button type="button" onClick={() => exportPlan(p)} className="btn btn-ghost btn-sm"><Icon name="upload" size={16}/>Export</button>
                      <button type="button" onClick={() => setConfirmDelete(p.id)} className="btn btn-ghost btn-sm danger ml-auto" aria-label={`Delete ${p.profile?.companyName || 'plan'}`}><Icon name="trash-2" size={16}/>Delete</button>
                    </div>
                  </article>
                );
              })}
            </div>
          )}

          <section className="mt-8">
            <h2 className="section-title">Backup and transfer</h2>
            <p className="help mb-3">Plans are stored in this browser only. Export them to move to another computer or keep a backup.</p>
            <div className="flex flex-wrap gap-3 items-center">
              <label className="btn btn-secondary" style={{cursor:'pointer'}} tabIndex={0} onKeyDown={e => (e.key==='Enter'||e.key===' ') && e.currentTarget.querySelector('input').click()}>
                <Icon name="download"/>Import plan (JSON)
                <input type="file" accept=".json" onChange={handleImport} className="sr-only" tabIndex={-1}/>
              </label>
              {plans.length > 0 && <>
                <button type="button" onClick={exportAll} className="btn btn-secondary"><Icon name="upload"/>Export all plans</button>
                <button type="button" onClick={clearAll} className="btn btn-ghost danger">Delete all plans</button>
              </>}
            </div>
            {importError && <p className="errmsg mt-3"><Icon name="circle-alert" size={16}/>{importError}</p>}
          </section>
        </div>
      </main>

      {confirmDelete && (
        <div className="scrim">
          <div className="dialog" role="alertdialog" aria-modal="true" aria-labelledby="del-t">
            <h2 id="del-t">Delete this plan?</h2>
            <p className="muted mb-5">This removes it from this browser and cannot be undone. Export it first if you may need it.</p>
            <div className="flex gap-3 flex-wrap">
              <button type="button" onClick={() => { onDelete(confirmDelete); setConfirmDelete(null); }} className="btn btn-danger"><Icon name="trash-2"/>Delete plan</button>
              <button type="button" autoFocus onClick={() => setConfirmDelete(null)} className="btn btn-secondary">Cancel</button>
            </div>
          </div>
        </div>
      )}
      <WorldAwareFooter/>
    </div>
  );
}

// ── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [screen,     setScreen]     = useState('dashboard');
  const [showAbout,  setShowAbout]  = useState(false);
  const [plans,      setPlans]      = useState(() => dbLoad().plans);
  const [plan,       setPlan]       = useState(null);
  const [phase,      setPhase]      = useState(1);
  const [p1step,     setP1step]     = useState(0);
  const [p2step,     setP2step]     = useState(0);
  const [ready,      setReady]      = useState(false);
  const [errors,     setErrors]     = useState({});
  const [saveStatus, setSaveStatus] = useState(null);
  const mainRef = useRef(null);

  function top() { window.scrollTo({top:0,behavior:'smooth'}); setTimeout(() => mainRef.current?.focus({preventScroll:true}), 0); }
  function refreshPlans() { setPlans(dbLoad().plans); }
  function startWizard(p) { setPlan({...p}); setPhase(1); setP1step(0); setP2step(0); setReady(false); setErrors({}); setScreen('wizard'); window.scrollTo({top:0,behavior:'smooth'}); }
  function goToDashboard() { refreshPlans(); setScreen('dashboard'); setReady(false); window.scrollTo({top:0,behavior:'smooth'}); }
  function doSave(s = plan) {
    const updated = {...s, updatedAt: new Date().toISOString()};
    setPlan(updated); dbSavePlan(updated); refreshPlans();
    setSaveStatus('saved'); setTimeout(() => setSaveStatus(null), 2500);
    return updated;
  }
  function update(key, val) { const next = {...plan, [key]: val}; setPlan(next); return next; }

  function validateP1() {
    if(p1step === 0) {
      const e = {};
      if(!plan.profile.companyName.trim()) e.companyName = 'Enter the company name.';
      if(!plan.profile.industry)           e.industry    = 'Choose an industry.';
      if(!plan.profile.employees)          e.employees   = 'Choose an employee range.';
      if(!plan.profile.locations)          e.locations   = 'Choose the number of locations.';
      setErrors(e); return Object.keys(e).length === 0;
    }
    if(p1step === 1) {
      const e = {};
      if(plan.functions.length === 0) { e._general = 'Add at least one critical function.'; setErrors(e); return false; }
      plan.functions.forEach((fn, i) => { if(!fn.name.trim()) { if(!e[i]) e[i]={}; e[i].name = 'Name this function, or remove it.'; } });
      setErrors(e); return Object.keys(e).length === 0;
    }
    setErrors({}); return true;
  }
  function validateP3() {
    if(!plan.config.consultantName.trim()) { setErrors({ consultantName: 'Enter the consultant name. It appears on the cover.' }); return false; }
    setErrors({}); return true;
  }
  function p1Next() {
    if(!validateP1()) return;
    if(p1step < 3) { setP1step(p1step + 1); top(); }
    else { doSave(); setPhase(2); setP2step(0); top(); }
  }
  function p1Prev() { setErrors({}); if(p1step > 0) { setP1step(p1step - 1); top(); } }
  function p2Next() {
    if(p2step === 0) {
      if(plan.selectedHazardIds.length === 0) { setErrors({hazards:'Select at least one hazard.'}); return; }
      setErrors({}); setP2step(1); top();
    } else {
      const rec = computeRecommended(plan.risks);
      const cfg = plan.config.selectedAnnexes.length === 0 ? {...plan.config, selectedAnnexes: rec} : plan.config;
      const next = {...plan, config: cfg};
      setPlan(next); doSave(next);
      setPhase(3); top();
    }
  }
  function p2Prev() {
    if(p2step > 0) { setP2step(0); top(); }
    else           { setPhase(1); setP1step(3); top(); }
  }
  function p3Finish() { if(!validateP3()) return; doSave(); setReady(true); top(); }
  // Rail navigation: only back to steps already done.
  function goStep(i) {
    setErrors({}); setReady(false);
    if(i <= 3) { setPhase(1); setP1step(i); }
    else if(i <= 5) { setPhase(2); setP2step(i-4); }
    else { setPhase(3); }
    top();
  }

  if(screen === 'dashboard') return (
    <>
      <Dashboard plans={plans} onNew={() => startWizard(newPlan())} onEdit={p => startWizard(p)}
        onDelete={id => { dbDeletePlan(id); refreshPlans(); }} onShowAbout={() => setShowAbout(true)}
        onImport={imported => { dbSavePlan(imported); refreshPlans(); }}/>
      {showAbout && <AboutModal onClose={() => setShowAbout(false)}/>}
    </>
  );

  const allHazards = [...HAZARD_LIST, ...plan.customHazards].filter(h => plan.selectedHazardIds.includes(h.id));
  const cur = stepIndex(phase, p1step, p2step, ready);
  const backLabel = phase===1 ? (p1step===0 ? null : 'Back') : phase===2 && p2step===0 ? 'Back to review' : phase===3 ? 'Back to matrix' : 'Back';
  const nextLabel = phase===1&&p1step===3 ? 'Continue to risk assessment' : phase===2&&p2step===1 ? 'Continue to plan configuration' : phase===3 ? 'Review and generate' : 'Continue';

  return (
    <div className="app">
      <div className="frame has-rail">
        <aside className="rail" aria-label="Plan steps">
          <a className="logo-link" href="./" onClick={e => { e.preventDefault(); goToDashboard(); }} aria-label="All plans"><img src="assets/wa-lockup-full-color.png" alt="World Aware, Emergency Planning" width="170" height="39"/></a>
          <button type="button" className="rail-back" onClick={goToDashboard}><Icon name="arrow-left" size={16}/>All plans</button>
          <div className="rail-client"><div className="k">Client</div><div className="v">{plan?.profile?.companyName || 'New plan'}</div></div>
          <StepRail current={cur} plan={plan} onGo={goStep}/>
          <div className="rail-foot">
            <button type="button" onClick={() => doSave()} className="btn btn-secondary btn-sm"><Icon name="save" size={16}/>Save progress</button>
            <span className="save-note" aria-live="polite">{saveStatus==='saved' && <><Icon name="check" size={16}/>Saved</>}</span>
          </div>
        </aside>
        <div style={{minWidth:0, display:'flex', flexDirection:'column'}}>
          <header className="mhead">
            <a href="./" onClick={e => { e.preventDefault(); goToDashboard(); }} aria-label="All plans"><img className="logo" src="assets/wa-lockup-full-color.png" alt="World Aware, Emergency Planning" width="130" height="30"/></a>
            <div className="mhead-r">
              <span className="save-note" aria-live="polite">{saveStatus==='saved' && <Icon name="check" size={16}/>}<span className="sr-only">{saveStatus==='saved'?'Saved':''}</span></span>
              <button type="button" onClick={() => doSave()} className="btn btn-ghost btn-sm"><Icon name="save" size={16}/>Save</button>
            </div>
          </header>
          <main className="content flex-1" ref={mainRef} tabIndex={-1} style={{outline:'none'}}>
            <div className="column">
              <MobileStep current={cur}/>
              {ready ? (
                <ReadyScreen state={plan} onBack={() => { setReady(false); top(); }} onDashboard={goToDashboard}/>
              ) : <>
                {phase===1 && p1step===0 && <StepProfile data={plan.profile} onChange={d => update('profile',{...plan.profile,...d})} errors={errors}/>}
                {phase===1 && p1step===1 && <StepFunctions data={plan.functions} onChange={v => update('functions',v)} errors={errors}/>}
                {phase===1 && p1step===2 && <StepPreparedness data={plan.preparedness} onChange={d => update('preparedness',{...plan.preparedness,...d})}/>}
                {phase===1 && p1step===3 && <P1Review state={plan}/>}
                {phase===2 && p2step===0 && <StepHazards selected={plan.selectedHazardIds} onChange={v => { update('selectedHazardIds',v); if(errors.hazards) setErrors({}); }} custom={plan.customHazards} onCustom={v => update('customHazards',v)} error={errors.hazards}/>}
                {phase===2 && p2step===1 && <RiskMatrix risks={plan.risks} onChange={v => { const n=update('risks',v); doSave(n); }} allHazards={allHazards}/>}
                {phase===3 && <StepConfig config={plan.config} onChange={v => update('config',v)} risks={plan.risks} errors={errors}/>}

                <div className="step-nav">
                  {backLabel ? <button type="button" onClick={phase===1?p1Prev:phase===2?p2Prev:()=>{setPhase(2);setP2step(1);top();}} className="btn btn-ghost"><Icon name="arrow-left"/>{backLabel}</button> : <span/>}
                  <button type="button" onClick={phase===1?p1Next:phase===2?p2Next:p3Finish} className="btn btn-primary">{nextLabel}</button>
                </div>
              </>}
            </div>
          </main>
        </div>
      </div>
      <WorldAwareFooter/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
