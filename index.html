<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Continuity Plan Builder | World Aware</title>
  <meta name="theme-color" content="#4D0000" />
  <link rel="icon" type="image/png" href="assets/wa-mark-full-color.png" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="js/icons.js"></script>
  <script>
    /* Tailwind is kept for layout utilities only. Brand colors and fonts map to tokens.css;
       preflight is off so it cannot reset the brand component styles in css/brand.css. */
    if (window.tailwind) tailwind.config = {
      corePlugins: { preflight: false },
      theme: { extend: {
        colors: { maroon: { DEFAULT:'var(--wa-maroon)', 50:'var(--maroon-50)', 600:'var(--maroon-600)', 700:'var(--maroon-700)' },
                  amber: { DEFAULT:'var(--wa-amber)', 200:'var(--amber-200)', 600:'var(--amber-600)' },
                  cream: 'var(--wa-cream)', ink: 'var(--color-text)', muted: 'var(--color-text-muted)',
                  line: 'var(--color-border)', page: 'var(--color-bg)' },
        fontFamily: { display: ['Space Grotesk','Segoe UI','Arial','sans-serif'], sans: ['Poppins','Segoe UI','Arial','sans-serif'] },
        borderRadius: { sm:'4px', DEFAULT:'4px', md:'8px' } } }
    };
  </script>
  <link rel="stylesheet" href="css/brand.css" />
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Storage (multi-plan) ─────────────────────────────────────────────────────
const DB_KEY = 'wa_plans_v1';
function dbLoad() { try { const r = localStorage.getItem(DB_KEY); return r ? JSON.parse(r) : { plans: [] }; } catch { return { plans: [] }; } }
function dbSave(db) { try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch {} }
function dbSavePlan(plan) { const db = dbLoad(); const idx = db.plans.findIndex(p => p.id === plan.id); if(idx>=0) db.plans[idx]=plan; else db.plans.push(plan); dbSave(db); }
function dbDeletePlan(id) { const db = dbLoad(); db.plans = db.plans.filter(p => p.id !== id); dbSave(db); }

// ── Constants ────────────────────────────────────────────────────────────────
const INDUSTRIES    = ['Manufacturing','Technology','Biotech / Life Sciences','Professional Services','Retail / E-Commerce','Healthcare','Financial Services','Logistics / Transportation','Construction / Real Estate','Education','Other'];
const EMP_RANGES    = ['1–10','11–50','51–200','201–500','501–1,000','1,001–5,000','5,000+'];
const LOC_RANGES    = ['1','2–3','4–10','11–25','26+'];
const CRIT_REASONS  = ['Revenue generation','Regulatory requirement','Customer commitment','Safety / life safety','Legal obligation','Core product delivery'];
const DOWNTIME_OPTS = ['2 hours','4 hours','8 hours','24 hours','3 days','7 days','30 days'];

// NOTE: `icon` values are kept as-is because they are copied into saved risks (localStorage).
// They are never rendered. The UI uses HAZARD_ICON (Lucide names) instead.
const HAZARD_LIST = [
  {id:'fire',          name:'Fire',                      icon:'🔥', cat:'Natural / Physical'},
  {id:'flood',         name:'Flood',                     icon:'🌊', cat:'Natural / Physical'},
  {id:'earthquake',    name:'Earthquake',                icon:'🌍', cat:'Natural / Physical'},
  {id:'tornado',       name:'Tornado / Severe Storm',    icon:'🌪️', cat:'Natural / Physical'},
  {id:'cyber',         name:'Cyber Attack / Ransomware', icon:'💻', cat:'Technological'},
  {id:'power',         name:'Power Outage',              icon:'⚡', cat:'Technological'},
  {id:'it-failure',    name:'IT System Failure',         icon:'🖥️', cat:'Technological'},
  {id:'supply',        name:'Supply Chain Disruption',   icon:'🔗', cat:'Operational'},
  {id:'key-person',    name:'Key Personnel Loss',        icon:'👤', cat:'Operational'},
  {id:'pandemic',      name:'Pandemic / Disease',        icon:'🦠', cat:'Health'},
  {id:'active-shooter',name:'Active Shooter / Violence', icon:'🚨', cat:'Security'},
  {id:'data-breach',   name:'Data Breach',               icon:'🔓', cat:'Technological'},
];
const HAZARD_ICON = { fire:'flame', flood:'waves', earthquake:'activity', tornado:'tornado', cyber:'shield-alert', power:'plug-zap', 'it-failure':'server', supply:'truck', 'key-person':'user-x', pandemic:'biohazard', 'active-shooter':'siren', 'data-breach':'lock-open' };
const hazardIcon = id => HAZARD_ICON[id] || 'circle-dashed';
const CATS = [...new Set(HAZARD_LIST.map(h => h.cat))];

const L_LABELS = ['Rare','Unlikely','Possible','Likely','Almost Certain'];
const I_LABELS = ['Insignificant','Minor','Moderate','Major','Catastrophic'];

// Phase 3 constants
const REQUIRED_SECTIONS = [
  { id:'exec-summary',  label:'Executive Summary',       desc:'High-level overview of the plan, key risks, and recovery priorities.' },
  { id:'introduction',  label:'Introduction & Purpose',  desc:'Plan scope, objectives, assumptions, and how to use this document.' },
  { id:'situation',     label:'Situation Overview',      desc:'Organization profile, critical functions, and current preparedness status.' },
  { id:'comms',         label:'Communications',          desc:'Notification procedures, contact lists, and stakeholder messaging.' },
  { id:'training',      label:'Training & Maintenance',  desc:'Exercise schedule, plan review cycle, and staff training requirements.' },
];

const ANNEXES = [
  { id:'natural',      title:'Natural Disasters',                   subtitle:'Fire, flood, earthquake, severe weather procedures',           icon:'tornado',      triggers:['fire','flood','earthquake','tornado'] },
  { id:'cyber-it',     title:'Cyber Incidents & IT Failure',        subtitle:'Ransomware, data breach, system outage, IT recovery',          icon:'shield-alert', triggers:['cyber','it-failure','data-breach','power'] },
  { id:'violence',     title:'Active Shooter / Workplace Violence',  subtitle:'Security incidents, lockdown, and evacuation procedures',       icon:'siren',        triggers:['active-shooter'] },
  { id:'key-person',   title:'Leadership Loss / Key Personnel',      subtitle:'Succession planning and knowledge transfer protocols',          icon:'user-x',       triggers:['key-person'] },
  { id:'pandemic',     title:'Pandemic Response',                    subtitle:'Disease outbreak and public health emergency procedures',        icon:'biohazard',    triggers:['pandemic'] },
  { id:'supply-chain', title:'Supply Chain Disruption',             subtitle:'Vendor failure, procurement continuity, and alternate sourcing', icon:'truck',        triggers:['supply'] },
];

function uid() { return `${Date.now()}-${Math.random().toString(36).slice(2,6)}`; }
function score(r)  { return r.likelihood * r.impact; }
// Band thresholds are unchanged from the original app (Medium starts at 5).
// Only the colors changed: one ordinal brand ramp, always shown with a word label and a meter.
function levelOf(s){ if(s>=15)return{label:'Critical',cls:'b-crit',lvl:4}; if(s>=10)return{label:'High',cls:'b-high',lvl:3}; if(s>=5)return{label:'Medium',cls:'b-mod',lvl:2}; return{label:'Low',cls:'b-low',lvl:1}; }
const BAND_ACTION = { Critical:'Act now', High:'Write a specific plan', Medium:'Cover in general preparedness', Low:'Monitor' };

// Smart annex recommendation based on HIGH/CRITICAL risks (score ≥ 10)
function computeRecommended(risks) {
  const highIds = new Set(risks.filter(r => score(r) >= 10).map(r => r.id));
  return ANNEXES.filter(a => a.triggers.some(t => highIds.has(t))).map(a => a.id);
}

const INIT_FN = () => ({ id: uid(), name: '', reason: '', downtime: '' });
const TODAY = new Date().toISOString().slice(0, 10);

function newPlan() {
  return {
    id: uid(),
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    profile:      { companyName:'', industry:'', employees:'', locations:'', address:'' },
    functions:    [INIT_FN()],
    preparedness: { hasExistingPlan:null, hasBackupPower:null, remoteWork:'', hasOffsiteBackup:null },
    risks:        [],
    selectedHazardIds: [],
    customHazards:     [],
    config: {
      selectedAnnexes: [],
      consultantName:    '',
      consultantCompany: 'World Aware',
      planVersion:       '1.0',
      planDate:          TODAY,
    },
  };
}
function fmtDate(iso) {
  if(!iso) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if(!m) return iso;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
}
function safeFileName(s) { return (s||'Company').replace(/[^a-zA-Z0-9\s]/g,'').replace(/\s+/g,'_'); }

// ── Icons (Lucide, inline SVG from js/icons.js) ──────────────────────────────
function Icon({ name, size = 20, className = '' }) {
  return <svg className={`wa-ic ${className}`} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false" dangerouslySetInnerHTML={{__html: (window.WA_ICONS||{})[name] || ''}}/>;
}

// ── Shared UI ────────────────────────────────────────────────────────────────
function RiskBadge({ s }) {
  const lv = levelOf(s);
  return <span className={`badge ${lv.cls}`}><span className="meter" aria-hidden="true">{[1,2,3,4].map(i => <i key={i} className={i<=lv.lvl?'f':''}/>)}</span>{lv.label}</span>;
}
let fieldSeq = 0;
function Field({ label, required, optional, error, hint, tooltip, children, id }) {
  const [fid] = useState(() => id || `f${++fieldSeq}`);
  const child = React.Children.only(children);
  const describedBy = [hint ? `${fid}-h` : null, error ? `${fid}-e` : null].filter(Boolean).join(' ') || undefined;
  return (
    <div className="field">
      <div className="label"><label htmlFor={fid}>{label}{optional && <span className="opt"> (optional)</span>}</label>{tooltip && <Tooltip text={tooltip} label={label}/>}</div>
      {React.cloneElement(child, { id: fid, 'aria-invalid': error ? 'true' : undefined, 'aria-describedby': describedBy })}
      {hint && <p className="help" id={`${fid}-h`}>{hint}</p>}
      {error && <p className="errmsg" id={`${fid}-e`}><Icon name="circle-alert" size={16}/>{error}</p>}
    </div>
  );
}
function TInput({ value, onChange, placeholder, ...r }) { return <input className="input" value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} {...r} />; }
function Select({ value, onChange, options, placeholder = 'Select…', ...r }) {
  return <div className="select-wrap"><select className="input" value={value} onChange={e => onChange(e.target.value)} {...r}><option value="">{placeholder}</option>{options.map(o => <option key={o} value={o}>{o}</option>)}</select><Icon name="chevron-down"/></div>;
}
function YesNo({ value, onChange, opts, label }) {
  const o = opts || [{ label:'Yes', value:'yes' }, { label:'No', value:'no' }];
  return <div className="seg" role="group" aria-label={label}>{o.map(op => <button key={op.value} type="button" aria-pressed={value === op.value} onClick={() => onChange(op.value)}>{op.label}</button>)}</div>;
}
function Checkbox({ checked, onChange, children }) {
  return (
    <button type="button" role="checkbox" aria-checked={checked} onClick={() => onChange(!checked)} className={`check ${checked ? 'on' : ''}`}>
      <span className="box">{checked && <Icon name="check" size={16}/>}</span>
      {children}
    </button>
  );
}

function Tooltip({ text, label }) {
  const [show, setShow] = useState(false);
  return (
    <span className="tip-wrap" onMouseLeave={() => setShow(false)}>
      <button type="button" className="tip-btn" aria-expanded={show} aria-label={`About ${label || 'this field'}`}
        onMouseEnter={() => setShow(true)} onFocus={() => setShow(true)} onBlur={() => setShow(false)}
        onClick={e => { e.preventDefault(); setShow(s => !s); }}>
        <Icon name="info" size={16}/>
      </button>
      {show && <span className="tip-pop" role="tooltip">{text}</span>}
    </span>
  );
}

function WorldAwareFooter() {
  return (
    <footer className="app-foot">
      <span>World Aware Emergency Planning, Boulder, Colorado</span>
      <a href="https://beworldaware.com" target="_blank" rel="noopener noreferrer">beworldaware.com</a>
    </footer>
  );
}
function Alert({ tone = 'info', title, children, icon }) {
  const ic = icon || { info:'info', ok:'circle-check', warn:'triangle-alert', err:'circle-alert', note:'info' }[tone];
  return <div className={`alert a-${tone}`} role={tone==='err'?'alert':undefined}><Icon name={ic}/><div>{title && <b>{title}</b>}<div className="body">{children}</div></div></div>;
}
function StepHead({ phase, title, children }) {
  return <header className="step-head"><span className="phase">{phase}</span><h1>{title}</h1>{children && <p>{children}</p>}</header>;
}

// ── Wizard steps (a real sequence, so numbered) ──────────────────────────────
const STEPS = [
  { key:'p1-0', group:'Client intake',      label:'Company profile' },
  { key:'p1-1', group:'Client intake',      label:'Critical functions' },
  { key:'p1-2', group:'Client intake',      label:'Preparedness' },
  { key:'p1-3', group:'Client intake',      label:'Intake review' },
  { key:'p2-0', group:'Risk assessment',    label:'Select hazards' },
  { key:'p2-1', group:'Risk assessment',    label:'Risk matrix' },
  { key:'p3',   group:'Plan configuration', label:'Sections and annexes' },
  { key:'ready',group:'Plan configuration', label:'Generate plan' },
];
function stepIndex(phase, p1step, p2step, ready) {
  if(ready) return 7;
  if(phase===1) return p1step;
  if(phase===2) return 4 + p2step;
  return 6;
}
function stepNote(i, plan) {
  if(!plan) return null;
  if(i===1) { const n = plan.functions.filter(f => f.name.trim()).length; return `${n} of ${plan.functions.length} named`; }
  if(i===4) return `${plan.selectedHazardIds.length} selected`;
  if(i===5) { const ids = new Set(plan.risks.map(r=>r.id)); const n = plan.selectedHazardIds.filter(id => ids.has(id)).length; return `${n} of ${plan.selectedHazardIds.length} rated`; }
  if(i===6) return `${plan.config.selectedAnnexes.length} annex${plan.config.selectedAnnexes.length!==1?'es':''}`;
  return null;
}
function StepRail({ current, plan, onGo }) {
  const groups = [...new Set(STEPS.map(s => s.group))];
  return (
    <div className="rail-steps">
      {groups.map(g => (
        <div key={g}>
          <p className="rail-group">{g}</p>
          <ol className="steps">
            {STEPS.map((s, i) => s.group !== g ? null : (() => {
              const state = i < current ? 'done' : i === current ? 'cur' : 'up';
              const lastInGroup = !STEPS[i+1] || STEPS[i+1].group !== g;
              const note = i === current ? stepNote(i, plan) : null;
              const inner = <>
                <span className="n">{state==='done' ? <Icon name="check" size={16}/> : i+1}</span>
                <span className="t">{s.label}{note && <small>{note}</small>}</span>
              </>;
              return (
                <li key={s.key} className={`${state} ${lastInGroup?'last':''}`}>
                  {state==='done'
                    ? <button type="button" className="step" onClick={() => onGo(i)}><span className="sr-only">Done: </span>{inner}</button>
                    : <div className="step" aria-current={state==='cur'?'step':undefined}>{inner}</div>}
                </li>
              );
            })())}
          </ol>
        </div>
      ))}
    </div>
  );
}
function MobileStep({ current }) {
  return (
    <div className="mstep">
      <div className="mstep-top"><b>{STEPS[current].label}</b><span>Step {current+1} of {STEPS.length}</span></div>
      <div className="mbar" style={{gridTemplateColumns:`repeat(${STEPS.length},1fr)`}} aria-hidden="true">
        {STEPS.map((s,i) => <i key={s.key} className={i<current?'d':i===current?'c':''}/>)}
      </div>
    </div>
  );
}

// ── PHASE 1 ──────────────────────────────────────────────────────────────────
function StepProfile({ data, onChange, errors }) {
  const f = k => v => onChange({[k]: v});
  return (
    <div>
      <StepHead phase="Client intake" title="Company profile">Tell us about the organization so the plan reflects how it actually operates.</StepHead>
      <div className="stack">
        <div className="fields-2">
          <Field label="Company name" error={errors.companyName} tooltip="The legal or operating name of the client organization. This appears on the cover page and throughout the generated plan."><TInput value={data.companyName} onChange={f('companyName')} placeholder="Pearl Street Roasters" autoComplete="organization"/></Field>
          <Field label="Industry or sector" error={errors.industry} tooltip="Used to tailor risk recommendations and regulatory references in the plan."><Select value={data.industry} onChange={f('industry')} options={INDUSTRIES} placeholder="Select industry…"/></Field>
        </div>
        <Field label="Primary address" optional><TInput value={data.address} onChange={f('address')} placeholder="1600 Pearl Street, Boulder CO 80302" autoComplete="street-address"/></Field>
        <div className="fields-2">
          <Field label="Number of employees" error={errors.employees} tooltip="Helps size response procedures and staffing requirements in the plan."><Select value={data.employees} onChange={f('employees')} options={EMP_RANGES} placeholder="Select range…"/></Field>
          <Field label="Number of locations" error={errors.locations} tooltip="Multi-location organizations require additional coordination procedures. Each location may have different hazard profiles."><Select value={data.locations} onChange={f('locations')} options={LOC_RANGES} placeholder="Select range…"/></Field>
        </div>
      </div>
    </div>
  );
}

function FnCard({ fn, index, onChange, onRemove, canRemove, error }) {
  const set = k => v => onChange({...fn, [k]: v});
  return (
    <div className={`fn ${error ? 'err' : ''}`}>
      <div className="fn-head">
        <b>Function {index+1}</b>
        {canRemove && <button type="button" onClick={onRemove} className="btn btn-ghost btn-sm danger" aria-label={`Remove function ${index+1}`}><Icon name="trash-2" size={16}/>Remove</button>}
      </div>
      <div className="stack">
        <Field label="Function name" error={error?.name}>
          <TInput value={fn.name} onChange={set('name')} placeholder="Order processing, patient care, payroll"/>
        </Field>
        <div className="fields-2">
          <Field label="Why it's critical" optional tooltip="The primary business justification. Used to prioritize recovery efforts and explain the function's importance in the plan."><Select value={fn.reason} onChange={set('reason')} options={CRIT_REASONS} placeholder="Select reason…"/></Field>
          <Field label="Max tolerable downtime" optional tooltip="Maximum Tolerable Downtime (MTD): how long this function can be offline before causing unacceptable harm to the business."><Select value={fn.downtime} onChange={set('downtime')} options={DOWNTIME_OPTS} placeholder="Select timeframe…"/></Field>
        </div>
      </div>
    </div>
  );
}

function StepFunctions({ data, onChange, errors }) {
  return (
    <div>
      <StepHead phase="Client intake" title="Critical business functions">List the one to five functions that must continue during a disruption.</StepHead>
      <div className="stack">
        {data.map((fn, i) => <FnCard key={fn.id} fn={fn} index={i} onChange={u => onChange(data.map((f,j) => j===i?u:f))} onRemove={() => onChange(data.filter((_,j) => j!==i))} canRemove={data.length > 1} error={errors[i]}/>)}
        {data.length < 5 && <button type="button" onClick={() => onChange([...data, INIT_FN()])} className="add-row"><Icon name="plus"/>Add another function ({data.length} of 5)</button>}
        {errors._general && <p className="errmsg"><Icon name="circle-alert" size={16}/>{errors._general}</p>}
      </div>
    </div>
  );
}

function StepPreparedness({ data, onChange }) {
  const f = k => v => onChange({[k]: v});
  const Q = ({ label, sub, val, ok, opts }) => (
    <div className="q-row">
      <p className="q">{label}{sub && <small>{sub}</small>}</p>
      <YesNo value={val} onChange={ok} opts={opts} label={label}/>
    </div>
  );
  return (
    <div>
      <StepHead phase="Client intake" title="Current preparedness">What is already in place today. Gaps become priority action items in the plan.</StepHead>
      <div className="stack">
        <div className="rows">
          <Q label="Do you have an existing emergency or continuity plan?" sub="Any documented plan for responding to disasters." val={data.hasExistingPlan} ok={f('hasExistingPlan')}/>
          <Q label="Do you have backup power (generator or UPS)?" sub="Equipment to maintain power at your primary location(s)." val={data.hasBackupPower} ok={f('hasBackupPower')}/>
          <Q label="Can your employees work remotely?" sub="Technology and policies for remote operations." val={data.remoteWork} ok={f('remoteWork')} opts={[{label:'Yes, all',value:'yes-all'},{label:'Partially',value:'partial'},{label:'No',value:'no'}]}/>
          <Q label="Do you have offsite or cloud data backups?" sub="Data stored separate from your primary site." val={data.hasOffsiteBackup} ok={f('hasOffsiteBackup')}/>
        </div>
        <Alert tone="note" title="Why these four">They are the most predictive factors in how quickly an organization recovers from a disruption.</Alert>
      </div>
    </div>
  );
}

function P1Review({ state }) {
  const { profile:p, functions:fns, preparedness:pr } = state;
  const gaps = [pr.hasExistingPlan==='no', pr.hasBackupPower==='no', pr.remoteWork==='no', pr.hasOffsiteBackup==='no'].filter(Boolean).length;
  const bl = v => v==='yes'?'Yes':v==='yes-all'?'Yes, all employees':v==='partial'?'Partially':v==='no'?'No':'Not answered';
  const Row = ({ l, v }) => !v ? null : <div><dt>{l}</dt><dd>{v}</dd></div>;
  return (
    <div>
      <StepHead phase="Client intake" title="Intake review">Confirm the intake details, then continue to the risk assessment.</StepHead>
      <div className="stack">
        <section className="sheet pad"><h2 className="section-title">Company profile</h2><dl className="dl"><Row l="Company" v={p.companyName}/><Row l="Industry" v={p.industry}/><Row l="Address" v={p.address}/><Row l="Employees" v={p.employees}/><Row l="Locations" v={p.locations}/></dl></section>
        <section className="sheet pad"><h2 className="section-title">Critical functions</h2>
          <ol className="outlist">{fns.map((fn,i) => <li key={fn.id}><span className="k">{i+1}</span><span><b className="font-medium">{fn.name || 'Unnamed function'}</b>{(fn.reason||fn.downtime) && <span className="help" style={{display:'block'}}>{[fn.reason, fn.downtime && `Max downtime ${fn.downtime}`].filter(Boolean).join('. ')}</span>}</span><span/></li>)}</ol>
        </section>
        <section className="sheet pad"><h2 className="section-title">Preparedness</h2><dl className="dl"><Row l="Existing plan" v={bl(pr.hasExistingPlan)}/><Row l="Backup power" v={bl(pr.hasBackupPower)}/><Row l="Remote work" v={bl(pr.remoteWork)}/><Row l="Offsite backup" v={bl(pr.hasOffsiteBackup)}/></dl></section>
        {gaps > 0 && <Alert tone="warn" title={`${gaps} preparedness gap${gaps>1?'s':''} identified`}>These become priority action items in the plan.</Alert>}
      </div>
    </div>
  );
}

// ── PHASE 2 ──────────────────────────────────────────────────────────────────
function StepHazards({ selected, onChange, custom, onCustom, error }) {
  const [inp, setInp] = useState('');
  const toggle = id => onChange(selected.includes(id) ? selected.filter(x => x!==id) : [...selected, id]);
  function addCustom() {
    const name = inp.trim(); if(!name) return;
    const id = `custom-${uid()}`;
    onCustom([...custom, {id, name, icon:'⚠️', cat:'Custom', custom:true}]);
    onChange([...selected, id]);
    setInp('');
  }
  const HzCheck = ({ h }) => {
    const on = selected.includes(h.id);
    return (
      <Checkbox checked={on} onChange={() => toggle(h.id)}>
        <span className="ttl"><Icon name={hazardIcon(h.id)} className="hz-ic"/>{h.name}{h.custom && <span className="tag plain">Custom</span>}</span>

function RiskMatrix({ risks, onChange, allHazards }) {
  const [activeId, setActiveId] = useState(null);
  const [printPreview, setPrintPreview] = useState(false);
  const [tip, setTip] = useState('');
  useEffect(() => {
    const first = allHazards.find(h => !risks.find(r => r.id===h.id));
    setActiveId(first ? first.id : allHazards[0]?.id ?? null);
  }, []);

  function placeRisk(l, i) {
    if(!activeId) return;
    const existing = risks.find(r => r.id===activeId);
    const hazard = allHazards.find(h => h.id===activeId);
    const next = existing ? risks.map(r => r.id===activeId ? {...r,likelihood:l,impact:i} : r) : [...risks, {id:activeId, name:hazard.name, icon:hazard.icon, likelihood:l, impact:i}];
    onChange(next);
    const placed = new Set(next.map(r => r.id));
    const nextH = allHazards.find(h => !placed.has(h.id) && h.id!==activeId);
    if(nextH) setActiveId(nextH.id);
  }

  const placed = new Set(risks.map(r => r.id));
  const sorted = [...risks].sort((a,b) => score(b)-score(a));
  const activeHazard = allHazards.find(h => h.id===activeId);
  const unrated = allHazards.length - allHazards.filter(h => placed.has(h.id)).length;
  const cellSentence = (l, i, names) => `Likelihood ${l} (${L_LABELS[l-1]}) by impact ${i} (${I_LABELS[i-1]}) = ${l*i}, ${levelOf(l*i).label}${names.length ? '. ' + names.join(', ') : ''}`;

  return (
    <div>
      <StepHead phase="Risk assessment" title="Risk matrix">Pick a hazard, then pick the cell that matches its likelihood and impact. The score is likelihood times impact.</StepHead>
      <div className="stack">
        <fieldset style={{border:0,margin:0,padding:0}}>
          <legend className="group-label">Hazards ({allHazards.length - unrated} of {allHazards.length} rated)</legend>

                  <span className="nm">{h.name}<small>{r ? `Likelihood ${r.likelihood}, impact ${r.impact}` : 'Not rated yet'}</small></span>

                </button>

          </div>
        </fieldset>

        {activeHazard && (
          <div className="placing" aria-live="polite">
            <Icon name={hazardIcon(activeHazard.id)}/>

                  const sentence = cellSentence(likelihood, impact, cellRisks.map(r => r.name));

                      <td><span className="num">{r.likelihood}</span><span className="sub">{L_LABELS[r.likelihood-1]}</span></td>
                      <td><span className="num">{r.impact}</span><span className="sub">{I_LABELS[r.impact-1]}</span></td>
                      <td className="score">{score(r)}</td>
                      <td><RiskBadge s={score(r)}/></td>
                      <td><button type="button" onClick={() => { setActiveId(r.id); onChange(risks.filter(x => x.id!==r.id)); }} className="btn btn-ghost btn-icon danger" aria-label={`Clear rating for ${r.name}`}><Icon name="x"/></button></td>
                    </tr>

                </tbody>
              </table>
            </div>
            <ol className="rank reg-list">
              {sorted.map((r, i) => (
                <li key={r.id}>
                  <span className="rn">{i+1}</span>
                  <span className="nm">{r.name}<small>Likelihood {r.likelihood} ({L_LABELS[r.likelihood-1]}), impact {r.impact} ({I_LABELS[r.impact-1]})</small></span>

function waNumbering() {
  const { LevelFormat, AlignmentType } = DX();
  return { config: [
    { reference:'wa-steps', levels:[{ level:0, format:LevelFormat.DECIMAL, text:'%1.', alignment:AlignmentType.LEFT, style:{ run:{ bold:true, color:WA.maroon }, paragraph:{ indent:{ left:400, hanging:300 } } } }] },
    { reference:'wa-bullets', levels:[{ level:0, format:LevelFormat.BULLET, text:'•', alignment:AlignmentType.LEFT, style:{ run:{ color:WA.amber }, paragraph:{ indent:{ left:360, hanging:240 } } } }] },
  ] };
}
const waNil = () => ({ style:DX().BorderStyle.NONE, size:0, color:'auto' });
const waNoBorders = () => { const n = waNil(); return { top:n, bottom:n, left:n, right:n, insideHorizontal:n, insideVertical:n }; };
const waTableBorders = () => { const { BorderStyle } = DX(); const n = waNil(); return {
  top:{ style:BorderStyle.SINGLE, size:4, color:WA.rule }, bottom:{ style:BorderStyle.SINGLE, size:8, color:WA.maroon },
  left:n, right:n, insideHorizontal:{ style:BorderStyle.SINGLE, size:4, color:WA.rule }, insideVertical:n }; };
const CELL_M = { top:100, bottom:100, left:120, right:120 };

// Text runs: anything in [SQUARE BRACKETS] becomes a WA Placeholder run (consultant completes it in Word).
// Procedure steps and checklist bullets in the content library leave a field blank as "Label: ", "Label: ." or
// "Label:  — next". Only those rows (opts.blanks) get a [TO BE COMPLETED] placeholder; ordinary sentences that end
// in a colon to introduce a list or table are left alone.
function fillBlanks(t) {
  return t.replace(/:\s*\.?\s*$/, ': [TO BE COMPLETED]')
          .replace(/:\s+(—|\.)/g, ': [TO BE COMPLETED] $1')
          .replace(/:\s{2,}(?=[A-Za-z])/g, ': [TO BE COMPLETED] ');
}
function runs(text, opts = {}) {
  const { TextRun } = DX();
  const { blanks, ...ro } = opts;
  let s = text == null ? '' : String(text);
  if(blanks) s = fillBlanks(s);
  opts = ro;
  const parts = s.split(/(\[[^\]]+\])/g).filter(x => x !== '');
  if(!parts.length) return [new TextRun({ text:'', ...opts })];
  return parts.map(p => /^\[[^\]]+\]$/.test(p) ? new TextRun({ text:p, style:'WAPlaceholder', bold:opts.bold }) : new TextRun({ text:p, ...opts }));
}
// Sentence case for headings; keeps acronyms and the plan's defined terms.
const KEEP_TERMS = ['Crisis Management Team','Incident Commander','Business Continuity Plan','Employee Assistance Program'];
function sentence(t) {
  let first = true;
  let out = String(t).split(/(\s+)/).map(w => {
    if(/^\s+$/.test(w) || !/[A-Za-z]/.test(w)) return w;
    if(/^[A-Z]\.\d+$/.test(w)) return w;                 // "A.1" prefixes
    const caps = (w.match(/[A-Z]/g) || []).length;
    let r = w;
    if(!(caps > 1 && !/-/.test(w))) {                      // keep IT, BCP, PPE, COVID…
      r = first ? w : w.charAt(0).toLowerCase() + w.slice(1);
      r = r.replace(/-([A-Z])([a-z])/g, (m,a,b) => '-' + a.toLowerCase() + b);
    }
    first = false;
    return r;
  }).join('');
  KEEP_TERMS.forEach(k => { out = out.replace(new RegExp(k, 'gi'), k); });
  return out;
}

// ── Doc primitives (names unchanged so the annex library below works as before) ──
// A sentence ending in a colon introduces the list or table after it, so keep the two on the same page.
function dp(text, opts = {}) { const { Paragraph } = DX(); return new Paragraph({ keepNext: /:\s*$/.test(String(text)), children: runs(text, opts) }); }
function dh1(text, o = {}) {
  const { Paragraph, TextRun, HeadingLevel } = DX();
  const out = [];
  // Sections that do not start a new page get generous space above so they still read as a new chapter.
  if(o.eyebrow) out.push(new Paragraph({ style:'WAEyebrow', pageBreakBefore:!!o.pageBreak, spacing: o.pageBreak ? undefined : { before:600, after:40 }, children:[new TextRun(o.eyebrow)] }));
  out.push(new Paragraph({ heading:HeadingLevel.HEADING_1, pageBreakBefore:!!o.pageBreak && !o.eyebrow, children:[new TextRun(sentence(text))] }));
  return out;
}
function dh2(text) { const { Paragraph, TextRun, HeadingLevel } = DX(); return new Paragraph({ heading:HeadingLevel.HEADING_2, children:[new TextRun(sentence(text))] }); }
function dh3(text) { const { Paragraph, TextRun, HeadingLevel } = DX(); return new Paragraph({ heading:HeadingLevel.HEADING_3, children:[new TextRun(sentence(text))] }); }
function dbullet(text) { const { Paragraph } = DX(); return new Paragraph({ numbering:{ reference:'wa-bullets', level:0 }, spacing:{ after:60 }, children: runs(text, { blanks:true }) }); }
function dnote(text) { const { Paragraph } = DX(); return new Paragraph({ style:'WASmall', children: runs(text) }); }
function dspacer(before = 160, after = 160) { const { Paragraph, TextRun } = DX(); return new Paragraph({ spacing:{ before:Math.round(before/2), after:Math.round(after/2), line:120, lineRule:DX().LineRuleType.AUTO }, children:[new TextRun({ text:'', size:4 })] }); }
function dph(label) { const { TextRun } = DX(); return new TextRun({ text:`[${label}]`, style:'WAPlaceholder' }); }
function dkv(label, value) {
  const { Paragraph, TextRun } = DX();
  return new Paragraph({ spacing:{ after:100 }, children:[
    new TextRun({ text:`${label}:  `, bold:true, color:WA.maroon }),
    value ? new TextRun({ text:value }) : dph('NOT PROVIDED'),
  ] });
}
// IF / THEN procedure: cream callout, amber spine, numbered steps that restart in every callout.
let IFTHEN_SEQ = 0;
function difthen(ifText, steps) {
  const { Paragraph, TextRun, Table, TableRow, TableCell, WidthType, ShadingType, BorderStyle } = DX();
  const instance = ++IFTHEN_SEQ;
  const n = waNil();
  const cell = new TableCell({
    width:{ size:CW, type:WidthType.DXA },
    shading:{ type:ShadingType.CLEAR, color:'auto', fill:WA.cream },
    margins:{ top:160, bottom:120, left:240, right:200 },
    borders:{ left:{ style:BorderStyle.SINGLE, size:24, color:WA.amber }, top:n, bottom:n, right:n },
    children:[
      new Paragraph({ style:'WACalloutLabel', children:[new TextRun('If')] }),
      new Paragraph({ spacing:{ after:140 }, children: runs(ifText.charAt(0).toUpperCase() + ifText.slice(1), { bold:true }) }),
      new Paragraph({ style:'WACalloutLabel', children:[new TextRun('Then')] }),
      ...steps.map(s => new Paragraph({ numbering:{ reference:'wa-steps', level:0, instance }, spacing:{ after:60 }, children: runs(s, { blanks:true }) })),
    ],
  });
  return [
    new Table({ width:{ size:CW, type:WidthType.DXA }, columnWidths:[CW], borders:waNoBorders(), rows:[new TableRow({ cantSplit:true, children:[cell] })] }),
    dspacer(120, 120),
  ];
}
function waNote(label, text, tone) {
  const { Paragraph, TextRun, Table, TableRow, TableCell, WidthType, ShadingType, BorderStyle } = DX();
  const gap = tone === 'gap';
  const n = waNil();
  return new Table({ width:{ size:CW, type:WidthType.DXA }, columnWidths:[CW], borders:waNoBorders(), rows:[new TableRow({ cantSplit:true, children:[new TableCell({
    width:{ size:CW, type:WidthType.DXA },
    shading:{ type:ShadingType.CLEAR, color:'auto', fill: gap ? WA.dangerBg : WA.cream },
    margins:{ top:120, bottom:120, left:240, right:200 },
    borders:{ left:{ style:BorderStyle.SINGLE, size:24, color: gap ? WA.danger : WA.forest }, top:n, bottom:n, right:n },
    children:[new Paragraph({ spacing:{ after:0 }, children:[ new TextRun({ text:label + '  ', bold:true, color: gap ? WA.danger : WA.forest }), ...runs(text) ] })],
  })] })] });

// ── Tables ────────────────────────────────────────────────────────────────────
function headCell(text, width, align) {
  const { TableCell, Paragraph, TextRun, WidthType, ShadingType, VerticalAlign, AlignmentType } = DX();
  return new TableCell({ width:{ size:width, type:WidthType.DXA }, shading:{ type:ShadingType.CLEAR, color:'auto', fill:WA.maroon }, margins:CELL_M, verticalAlign:VerticalAlign.BOTTOM,
    children:[new Paragraph({ style:'WATableHead', keepNext:true, alignment: align || AlignmentType.LEFT, children:[new TextRun(text)] })] });
}
function bodyCell(content, width, row, o = {}) {
  const { TableCell, Paragraph, WidthType, ShadingType, VerticalAlign, AlignmentType } = DX();
  const children = Array.isArray(content) ? content : runs(content == null || content === '' ? '—' : content, { bold:o.bold, color:o.color });
  return new TableCell({ width:{ size:width, type:WidthType.DXA }, shading:{ type:ShadingType.CLEAR, color:'auto', fill: o.fill || (row % 2 ? WA.band : WA.white) }, margins:CELL_M, verticalAlign:VerticalAlign.CENTER,
    children:[new Paragraph({ style:'WATableText', keepNext: !!o.keepNext, alignment: o.align || AlignmentType.LEFT, children })] });
}
function riskCell(label, width, keepNext) {
  const { TextRun } = DX();
  const b = WA_RISK[label];
  return bodyCell([new TextRun({ text:label, bold:true, color:b.ink })], width, 0, { fill:b.fill, keepNext });
}
function waTable(cols, rows, o = {}) {
  const { Table, TableRow, WidthType, TableLayoutType } = DX();
  const head = o.noHead ? [] : [new TableRow({ tableHeader:true, cantSplit:true, children: cols.map(c => headCell(c.title, c.width, c.align)) })];
  return new Table({ width:{ size:CW, type:WidthType.DXA }, columnWidths: cols.map(c => c.width), layout:TableLayoutType.FIXED, borders:waTableBorders(),
    // Short tables (12 rows or fewer) are kept on one page: keep-with-next on every row but the last.
    rows:[...head, ...rows.map((r, i) => { const kn = rows.length <= 12 && i < rows.length - 1;
      return new TableRow({ cantSplit:true, children: r.map((v, j) => (v && v.__cell) ? (kn && v.__band ? riskCell(v.__band, v.__w, true) : v.__cell) : bodyCell(v, cols[j].width, i, { align:cols[j].align, bold:cols[j].bold, keepNext:kn })) }); })] });
}
const bandOf = s => s >= 15 ? 'Critical' : s >= 10 ? 'High' : s >= 5 ? 'Medium' : 'Low';

function riskTable(risks) {
  const { AlignmentType } = DX();
  const sorted = [...risks].sort((a, b) => (b.likelihood * b.impact) - (a.likelihood * a.impact));
  const cols = [ {title:'#',width:500}, {title:'Hazard',width:2700,bold:true}, {title:'Likelihood',width:1500}, {title:'Impact',width:1500}, {title:'Score',width:900,bold:true}, {title:'Risk band',width:2260} ];
  return waTable(cols, sorted.map((r, idx) => {
    const s = r.likelihood * r.impact;
    return [ `${idx + 1}`, r.name, `${r.likelihood}, ${L_LABELS[r.likelihood - 1]}`, `${r.impact}, ${I_LABELS[r.impact - 1]}`, `${s}`, { __cell: riskCell(bandOf(s), 2260), __band: bandOf(s), __w: 2260 } ];
  }));
}
// Label / value table. opts.header: first row is a column header (maroon row).
function twoColTable(rows, opts = {}) {
  const { TextRun } = DX();
  const cols = [ {title:'',width:3600}, {title:'',width:5760} ];
  let body = rows;
  if(opts.header) { cols[0].title = rows[0][0]; cols[1].title = rows[0][1] || ''; body = rows.slice(1); }
  return waTable(cols, body.map(([label, value]) => [ label, value ? value : [dph('TO BE COMPLETED')] ]), { noHead: !opts.header });
}
function functionsTable(fns) {
  const cols = [ {title:'Critical function',width:2808,bold:true}, {title:'Why critical',width:2340}, {title:'Max downtime',width:2340}, {title:'Department',width:1872} ];
  return waTable(cols, fns.map(fn => [ fn.name || '[FUNCTION NAME]', fn.reason || '—', fn.downtime || '—', '[DEPARTMENT]' ]));
}
function bandKeyTable(rows) {
  const cols = [ {title:'Score',width:1300,bold:true}, {title:'Risk band',width:1800}, {title:'Treatment',width:6260} ];
  return waTable(cols, rows.map(([range, band, action]) => [ range, { __cell: riskCell(band, 1800), __band: band, __w: 1800 }, action ]));
}
